apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: api-alert-config
  namespace: demo
  labels:
    release: kube-prometheus-stack
spec:
  route:
    groupBy: ['alertname']
    groupWait: 10s
    groupInterval: 10s
    repeatInterval: 1h
    receiver: 'email-receiver'
    routes:
    - matchers:
      - name: alertname
        value: ApiHighErrorRate
      receiver: 'email-receiver'
  receivers:
  - name: 'email-receiver'
    emailConfigs:
    - to: 'rondepzai9@gmail.com'  # Email của bạn
      from: 'rondepzai9@gmail.com'  # Email gửi (Gmail của bạn)
      smarthost: 'smtp.gmail.com:587'  # Cấu hình SMTP Gmail
      authUsername: 'rondepzai9@gmail.com'  # Tài khoản đăng nhập Gmail của bạn
      authPassword:
        name: alertmanager-smtp-credentials
        key: password
      requireTLS: true
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp-credentials
  namespace: demo
type: Opaque
stringData:
  password: "yewh jhbt ygxk rnil"
